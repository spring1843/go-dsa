version: "2"
run:
  relative-path-mode: gomod
linters:
  default: all
  disable:
    # Deprecated, replaced by exhaustruct_v5 and gomodguard_v2 which are enabled.
    - exhaustruct
    - gomodguard
    - forcetypeassert
    - gochecknoglobals
    - lll
    - mnd
    - nlreturn
    - paralleltest
    - testpackage
    - varnamelen
    - wsl
    # Replacement for wsl.
    - wsl_v5
    # Inline error handling is idiomatic Go.
    - noinlineerr
    # container/heap types conventionally mix value and pointer receivers.
    - recvcheck
  settings:
    errcheck:
      check-blank: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
        - experimental
      disabled-checks:
        - unnamedResult
    godoclint:
      default: basic
      options:
        start-with-name:
          include-unexported: true
    govet:
      enable-all: true
      disable:
        # Field order is chosen for readability.
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        # Package comments are not required.
        - -ST1000
    unparam:
      check-exported: true
    dupword:
      ignore:
        # Spoken digits in the Look and Tell problem.
        - one
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/spring1843/go-dsa
            - github.com/spf13/cobra
    forbidigo:
      forbid:
        - pattern: ioutil\.*
  exclusions:
    rules:
      # Test inputs are easier to read when they are repeated and not constants.
      - path: _test\.go
        linters:
          - dupl
          - goconst
      # cobra commands only set the few fields they need.
      - text: cobra\.Command is missing fields
        linters:
          - exhaustruct_v5
      - text: package-comments
        linters:
          - revive
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra:
        group-params: true
